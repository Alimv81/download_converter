name: Build Windows EXE (Nuitka)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka intelhex

      - name: Build onefile exe
        run: |
          python -m nuitka .\converter.py --onefile --enable-plugin=tk-inter --include-module=gui --output-dir=dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: converter-windows-exe
          path: dist/converter.exe

